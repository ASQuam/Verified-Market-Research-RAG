# Streamlit theme for the Team 2 app. Keep this file in a folder named ".streamlit"
# inside the folder you run "streamlit run" from. Dark slate theme to match the app's CSS.
[theme]
base = "dark"
primaryColor = "#43B7A0"
backgroundColor = "#171E2B"
secondaryBackgroundColor = "#303D4D"
textColor = "#DCE4ED"
font = "sans serif"