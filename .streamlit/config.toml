# Streamlit theme for the Team 2 app. Keep this file in a folder named ".streamlit"
# inside the folder you run "streamlit run" from. Dark slate theme to match the app's CSS.
[theme]
base = "dark"
primaryColor = "#43B7A0"
backgroundColor = "#171E2B"
secondaryBackgroundColor = "#303D4D"
textColor = "#DCE4ED"
# IBM Plex Sans from Google Fonts, for all of Streamlit's built-in text, headings, and tables
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap, sans-serif"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap, sans-serif"